<script src="launch.js"></script>
<script>
  const buttons = document.querySelectorAll('[data-set-lang]');
  // A code is the app's own name for a language (AppLanguage.name, the
  // guide's folder names too); <html lang> takes its BCP 47 tag, which
  // differs only for Chinese — the tag is what picks a Chinese face.
  const tagOf = (lang) => (lang === 'zhHans' ? 'zh-Hans' : lang);
  const apply = (lang) => {
    document.documentElement.lang = tagOf(lang);
    buttons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.setLang === lang)));
    try { localStorage.setItem('anicel-lang', lang); } catch (_) {}
  };
  buttons.forEach((b) => b.addEventListener('click', () => apply(b.dataset.setLang)));
  try {
    const saved = localStorage.getItem('anicel-lang');
    const reader = navigator.language;
    if (saved) apply(saved);
    else if (reader.startsWith('ko')) apply('ko');
    else if (reader.startsWith('fr')) apply('fr');
    // Every Chinese reads 简体, as in the app (AppLanguage.languageCode, F-157).
    else if (reader.startsWith('zh')) apply('zhHans');
    else if (!reader.startsWith('ja')) apply('en');
  } catch (_) {}

  // Each build's notes are the very file the app shows in its launch window
  // (assets/launch/<language>/whats_new.md), copied here by the release
  // round under launch/<build>/ — written once, read in both places.
  // launch/builds.json lists the builds, newest first.
  const { LANGS, render, fetchText } = window.AnicelLaunch;
  const BUILD = { ja: 'ビルド', ko: '빌드', en: 'Build', fr: 'Build', zhHans: '版本' };
  const NONE = {
    ja: 'まだありません。', ko: '아직 없습니다.', en: 'Nothing yet.',
    fr: 'Rien pour le moment.', zhHans: '暂无记录。',
  };
  const DATE = {
    ja: 'ja-JP', ko: 'ko-KR', en: 'en-GB', fr: 'fr-FR', zhHans: 'zh-Hans-CN',
  };

  (async () => {
    const root = document.getElementById('builds');
    let builds = [];
    try {
      const r = await fetch('launch/builds.json', { cache: 'no-cache' });
      if (r.ok) builds = await r.json();
    } catch (_) {}
    if (!builds.length) {
      root.innerHTML = '<p>' + LANGS.map((l) => `<span data-lang="${l}">${NONE[l]}</span>`).join('') + '</p>';
      return;
    }
    const parts = await Promise.all(builds.map(async (b) => {
      const notes = await Promise.all(LANGS.map((l) => fetchText(`launch/${b.n}/${l}/whats_new.md`)));
      const when = new Date(`${b.date}T00:00:00`);
      const head = LANGS.map((l) =>
        `<span data-lang="${l}">${BUILD[l]} ${b.n} · ${when.toLocaleDateString(DATE[l], { year: 'numeric', month: 'long', day: 'numeric' })}</span>`).join('');
      const body = LANGS.map((l, i) => (notes[i] ? `<div data-lang="${l}">${render(notes[i])}</div>` : '')).join('');
      return `<h2 id="build-${b.n}">${head}</h2>${body}`;
    }));
    root.innerHTML = parts.join('');
  })();
</script>

</body>
</html>
